spring.application.name=social-network-visualizer-backend
spring.neo4j.uri=bolt://neo4j-database:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=notverysecret

logging.level.org.neo4j=INFO
logging.level.org.neo4j.driver=INFO
logging.level.org.springframework.data.neo4j=INFO

# dir or file
loader.mode=dir
# true or false
drop.mode=true
data.tweets.dir.path=./src/main/resources/data
data.tweets.file.path=./src/main/resources/output.json
