spring.application.name=social-network-visualizer-backend

# MongoDB
spring.data.mongodb.host=${MONGO_HOST}
spring.data.mongodb.port=${MONGO_PORT}
spring.data.mongodb.database=${MONGO_DATABASE}
spring.data.mongodb.username=${MONGO_USERNAME}
spring.data.mongodb.password=${MONGO_PASSWORD}
spring.data.mongodb.authentication-database=${MONGO_AUTH_DB}

# Neo4j
spring.neo4j.uri=${NEO4J_URI}
spring.neo4j.authentication.username=${NEO4J_USERNAME}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}

# Logging
logging.level.org.neo4j=INFO
logging.level.org.neo4j.driver=INFO
logging.level.org.neo4j.driver.internal=WARN
logging.level.org.neo4j.bolt=WARN
logging.level.org.springframework.data.neo4j=OFF
logging.level.org.neo4j.cypher=ERROR
logging.level.org.springframework.data.neo4j.cypher.deprecation=ERROR

# true or false
drop.mode=true

# max file size
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB

# service health check
management.endpoints.web.exposure.include=health
