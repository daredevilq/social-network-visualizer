spring.application.name=social-network-visualizer-backend

# MongoDB
spring.data.mongodb.host=mongodb
#spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=socialdb
spring.data.mongodb.username=root
spring.data.mongodb.password=secret
spring.data.mongodb.authentication-database=admin

# Neo4j
spring.neo4j.uri=bolt://neo4j-database:7687
#spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=notverysecret

logging.level.org.neo4j=INFO
logging.level.org.neo4j.driver=INFO
logging.level.org.springframework.data.neo4j=OFF
logging.level.org.neo4j.cypher=ERROR

# true or false
drop.mode=true

# max file size
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB
