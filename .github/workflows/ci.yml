name: CI - Backend & Frontend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Backend Style Check
        run: mvn spotless:check
        working-directory: ./social-network-visualizer-backend

      - name: Backend Build & Test
        run: mvn clean install
        working-directory: ./social-network-visualizer-backend

  frontend-ci:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: social-network-visualizer-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./social-network-visualizer-frontend

      - name: Frontend Style Check
        run: npm run prettier:check
        working-directory: ./social-network-visualizer-frontend

      - name: Frontend Build & Test
        run: |
          npm run build
          npm test -- --watchAll=false
        working-directory: ./social-network-visualizer-frontend
